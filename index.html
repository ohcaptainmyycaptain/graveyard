<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Join the server</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

  <div class="scene">
    <span class="badge"><span class="dot"></span>Online now</span>

    <h1>Come hang out! 🎀</h1>
    <p class="sub">The server's live and the chats are always moving. Pop in and say hi.</p>

    <div class="card">
      <div class="frame">
        <iframe src="https://discord.com/widget?id=1345882876255797292&theme=dark"
          width="350" height="500"
          allowtransparency="true"
          frameborder="0"
          sandbox="allow-popups allow-popups-to-escape-sandbox allow-same-origin allow-scripts">
        </iframe>
      </div>
    </div>

    <p class="foot">Can't see members? <a href="https://discord.com/widget?id=1345882876255797292&theme=dark" target="_blank" rel="noopener">Open it directly</a>.</p>
  </div>

</body>
</html>
